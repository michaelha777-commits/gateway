name: Diagnose HomeWatch build

on:
  push:
    branches:
      - homewatch-v2
    paths:
      - .github/workflows/homewatch2-direct-fix.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: homewatch-build-diagnostics
  cancel-in-progress: true

jobs:
  diagnose:
    runs-on: windows-latest
    steps:
      - name: Checkout homewatch-v2
        uses: actions/checkout@v4
        with:
          ref: homewatch-v2
          fetch-depth: 0

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Capture Release build output
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          dotnet build .\HomeWatch2\HomeWatch2.csproj --configuration Release *>&1 |
            Tee-Object -FilePath .\HomeWatch2\ci-build.log
          exit 0

      - name: Commit diagnostic log
        shell: pwsh
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add HomeWatch2/ci-build.log
          if (-not (git diff --cached --quiet)) {
            git commit -m 'Capture HomeWatch2 build diagnostics'
            git push origin HEAD:homewatch-v2
          }
