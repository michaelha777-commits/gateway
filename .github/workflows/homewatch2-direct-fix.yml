name: Repair HomeWatch build

on:
  push:
    branches:
      - homewatch-v2
    paths:
      - .github/workflows/homewatch2-direct-fix.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: homewatch-build-repair
  cancel-in-progress: true

jobs:
  repair:
    runs-on: windows-latest
    steps:
      - name: Checkout homewatch-v2
        uses: actions/checkout@v4
        with:
          ref: homewatch-v2
          fetch-depth: 0

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Fix NetworkDiscovery compile error
        shell: pwsh
        run: |
          $path = 'HomeWatch2/NetworkDiscovery.cs'
          $text = Get-Content -LiteralPath $path -Raw
          $old = 'private static async Task MergeDeviceAsync'
          $new = 'private async Task MergeDeviceAsync'
          if (-not $text.Contains($old)) {
            throw "Expected MergeDeviceAsync declaration was not found."
          }
          $text = $text.Replace($old, $new)
          Set-Content -LiteralPath $path -Value $text -Encoding utf8

      - name: Build HomeWatch Release
        run: dotnet build .\HomeWatch2\HomeWatch2.csproj --configuration Release

      - name: Commit tested repair
        shell: pwsh
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add HomeWatch2/NetworkDiscovery.cs
          if (-not (git diff --cached --quiet)) {
            git commit -m 'Fix NetworkDiscovery instance method call'
            git push origin HEAD:homewatch-v2
          }
