name: Bake HomeWatch runtime patches

on:
  push:
    branches: [homewatch-v2]
    paths:
      - '.github/workflows/homewatch-bake-runtime-patches.yml'

permissions:
  contents: write

jobs:
  bake:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: homewatch-v2

      - name: Apply existing patches once
        shell: powershell
        run: |
          & .\HomeWatch2\Apply-NetworkDiscoveryPatch.ps1
          & .\HomeWatch2\Apply-AdultClassifierPatch.ps1
          & .\HomeWatch2\Apply-AdultIntelligencePatch.ps1

      - name: Stop startup from editing source
        shell: python
        run: |
          from pathlib import Path
          path = Path('HomeWatch2/Start-HomeWatch2.ps1')
          text = path.read_text(encoding='utf-8-sig')
          start = text.index("    $networkPatch = Join-Path $PSScriptRoot 'Apply-NetworkDiscoveryPatch.ps1'")
          end = text.index("    $saved = $null", start)
          text = text[:start] + "    # Features are compiled into HomeWatch. Startup must never modify source files.\n\n" + text[end:]
          path.write_text(text, encoding='utf-8')

      - name: Build HomeWatch
        shell: powershell
        run: dotnet build .\HomeWatch2\HomeWatch2.csproj --configuration Release

      - name: Commit baked source
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add HomeWatch2/Program.cs HomeWatch2/Start-HomeWatch2.ps1
          git diff --cached --quiet || git commit -m "Bake HomeWatch features into source and stop startup patching"
          git push origin homewatch-v2
