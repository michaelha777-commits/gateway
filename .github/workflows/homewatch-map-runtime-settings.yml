name: Map HomeWatch runtime settings

on:
  push:
    branches: [homewatch-v2]
    paths:
      - '.github/workflows/homewatch-map-runtime-settings.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: homewatch-v2
      - name: Map runtime settings endpoints
        shell: python
        run: |
          from pathlib import Path
          path = Path('HomeWatch2/Program.cs')
          text = path.read_text(encoding='utf-8')
          marker = 'app.MapFallbackToFile("index.html");'
          line = 'app.MapRuntimeSettingsEndpoints();\n\n'
          if 'app.MapRuntimeSettingsEndpoints();' not in text:
              if marker not in text:
                  raise SystemExit('Program.cs fallback marker not found')
              text = text.replace(marker, line + marker, 1)
              path.write_text(text, encoding='utf-8')
      - name: Build HomeWatch
        run: dotnet build HomeWatch2/HomeWatch2.csproj --configuration Release
      - name: Commit mapped endpoint
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add HomeWatch2/Program.cs
          git commit -m "Map runtime settings and domain intelligence endpoints"
          git push origin homewatch-v2
