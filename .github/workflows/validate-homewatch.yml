name: Validate HomeWatch

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  nas-database:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify Synology launcher and idle database discovery
        run: |
          python3 tools/zenarmor/test_nas_database.py
          python3 tools/zenarmor/test_nas_activation.py
          python3 tools/zenarmor/test_nas_legacy.py
          sh tools/zenarmor/tests/preflight-permissions.sh
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Verify published and framework-dependent HomeWatch services
        run: |
          python3 tools/zenarmor/test_published_nas.py
          python3 tools/zenarmor/test_published_nas.py --self-contained

  validate:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Verify Synology systemctl compatibility
        shell: bash
        run: sh tools/zenarmor/tests/nas-properties.sh

      - name: Validate legacy HomeWatch
        shell: powershell
        run: .\Validate-HomeWatch.ps1

      - name: Validate HomeWatch2 agent and exact installer command
        shell: powershell
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File .\HomeWatch2\Test-HomeWatch2-Agent.ps1

      - name: Build HomeWatch2 Release
        shell: powershell
        run: dotnet build .\HomeWatch2\HomeWatch2.csproj --configuration Release

      - name: Build HomeWatch3 Release
        shell: powershell
        run: dotnet build .\HomeWatch3\HomeWatch3.csproj --configuration Release

      - name: Verify HomeWatch4 TLS coverage
        run: python tools/test-homewatch4-tls.py

      - name: Test Zenarmor restricted reader and Toronto time
        run: |
          python tools/zenarmor/test_reports.py
          node tools/zenarmor/tests/time.cjs
      - name: Test collector persistence, source recovery and mobile dashboards
        env:
          HOMEWATCH_BROWSER_TEST: "1"
        run: |
          dotnet build tools/zenarmor/tests/transport -c Release
          python tools/zenarmor/tests/integration.py
