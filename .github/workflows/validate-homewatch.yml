name: Validate HomeWatch

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate PowerShell and web source
        id: core_validation
        continue-on-error: true
        shell: powershell
        run: |
          & .\Validate-HomeWatch.ps1 *>&1 | Tee-Object -FilePath core-validation.log
          exit $LASTEXITCODE

      - name: Validate restricted local diagnostics agent
        id: agent_validation
        continue-on-error: true
        shell: powershell
        run: |
          & .\Test-HomeWatch-Agent.ps1 *>&1 | Tee-Object -FilePath agent-validation.log
          exit $LASTEXITCODE

      - name: Upload complete validation reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: homewatch-validation-reports
          path: |
            core-validation.log
            agent-validation.log
          if-no-files-found: warn

      - name: Fail when validation fails
        if: steps.core_validation.outcome != 'success' || steps.agent_validation.outcome != 'success'
        shell: powershell
        run: |
          Write-Error 'One or more HomeWatch validations failed. See the uploaded validation reports.'
          exit 1
