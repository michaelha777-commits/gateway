name: Validate HomeWatch

on:
  push:
    branches:
      - main
      - 'agent/**'
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-homewatch-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate PowerShell and web source
        shell: powershell
        run: |
          $process = Start-Process powershell.exe -Wait -PassThru -NoNewWindow -ArgumentList @(
            '-NoProfile',
            '-ExecutionPolicy', 'Bypass',
            '-Command', "& '.\Validate-HomeWatch.ps1' *>&1 | Tee-Object -FilePath 'core-validation.log'; exit `$LASTEXITCODE"
          )
          exit $process.ExitCode

      - name: Validate restricted local diagnostics agent
        shell: powershell
        run: |
          $process = Start-Process powershell.exe -Wait -PassThru -NoNewWindow -ArgumentList @(
            '-NoProfile',
            '-ExecutionPolicy', 'Bypass',
            '-Command', "& '.\Test-HomeWatch-Agent.ps1' *>&1 | Tee-Object -FilePath 'agent-validation.log'; exit `$LASTEXITCODE"
          )
          exit $process.ExitCode

      - name: Upload complete validation reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: homewatch-validation-reports
          path: |
            core-validation.log
            agent-validation.log
          if-no-files-found: warn
