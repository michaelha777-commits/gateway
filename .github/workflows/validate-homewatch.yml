name: Validate HomeWatch

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate legacy HomeWatch
        shell: powershell
        run: .\Validate-HomeWatch.ps1

      - name: Validate HomeWatch2 agent and exact installer command
        shell: powershell
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File .\HomeWatch2\Test-HomeWatch2-Agent.ps1

      - name: Build HomeWatch2 Release
        shell: powershell
        run: dotnet build .\HomeWatch2\HomeWatch2.csproj --configuration Release
