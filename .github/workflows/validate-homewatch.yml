name: Validate HomeWatch

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Run all HomeWatch validations
        shell: powershell
        run: |
          $failed = $false

          & .\Validate-HomeWatch.ps1 *>&1 | Tee-Object -FilePath core-validation.log
          if ($LASTEXITCODE -ne 0) { $failed = $true }

          & .\Test-HomeWatch-Agent.ps1 *>&1 | Tee-Object -FilePath agent-validation.log
          if ($LASTEXITCODE -ne 0) { $failed = $true }

          if ($failed) {
            Write-Error 'One or more HomeWatch validations failed.'
            exit 1
          }

      - name: Upload complete validation reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: homewatch-validation-reports
          path: |
            core-validation.log
            agent-validation.log
          if-no-files-found: warn
