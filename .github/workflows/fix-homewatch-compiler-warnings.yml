name: Fix HomeWatch compiler warnings

on:
  workflow_dispatch:
  push:
    branches:
      - homewatch-v2
    paths:
      - '.github/workflows/fix-homewatch-compiler-warnings.yml'

permissions:
  contents: write

jobs:
  fix-and-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out homewatch-v2
        uses: actions/checkout@v4
        with:
          ref: homewatch-v2
          fetch-depth: 0

      - name: Apply the two warning fixes
        shell: python
        run: |
          from pathlib import Path

          network_path = Path('HomeWatch2/NetworkDiscovery.cs')
          network = network_path.read_text(encoding='utf-8')
          old_parameter = '    IHttpClientFactory httpClientFactory,\n'
          if old_parameter not in network:
              raise SystemExit('Expected unused IHttpClientFactory constructor parameter was not found.')
          network_path.write_text(network.replace(old_parameter, '', 1), encoding='utf-8')

          program_path = Path('HomeWatch2/Program.cs')
          program = program_path.read_text(encoding='utf-8')
          old_method = '''static string RootDomain(string domain)
          {
              var parts = (domain ?? "").Trim('.').ToLowerInvariant().Split('.', StringSplitOptions.RemoveEmptyEntries);
              return parts.Length >= 2 ? string.Join('.', parts[^2], parts[^1]) : domain;
          }'''
          new_method = '''static string RootDomain(string domain)
          {
              var normalized = (domain ?? string.Empty).Trim('.').ToLowerInvariant();
              var parts = normalized.Split('.', StringSplitOptions.RemoveEmptyEntries);
              return parts.Length >= 2 ? string.Join('.', parts[^2], parts[^1]) : normalized;
          }'''
          if old_method not in program:
              raise SystemExit('Expected RootDomain method was not found.')
          program_path.write_text(program.replace(old_method, new_method, 1), encoding='utf-8')

      - name: Build with warnings treated as errors
        run: dotnet build HomeWatch2/HomeWatch2.csproj -c Release --property:TreatWarningsAsErrors=true

      - name: Commit repaired source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add HomeWatch2/NetworkDiscovery.cs HomeWatch2/Program.cs
          if git diff --cached --quiet; then
            echo "No source changes to commit."
            exit 0
          fi
          git commit -m "Fix remaining HomeWatch compiler warnings"
          git push origin HEAD:homewatch-v2
