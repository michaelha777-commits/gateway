name: HomeWatch2 next fix

on:
  push:
    branches: [homewatch-v2]
    paths:
      - .github/workflows/homewatch2-next-fix.yml

permissions:
  contents: write

jobs:
  patch-test-commit:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: homewatch-v2
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply, validate, and commit fixes
        shell: pwsh
        run: |
          @'
          from pathlib import Path
          import re
          def one(t,o,n,l):
              if o not in t: raise SystemExit(f'Missing {l}')
              return t.replace(o,n,1)
          p=Path('HomeWatch2/Program.cs'); s=p.read_text(encoding='utf-8-sig')
          s=s.replace('builder.Services.AddHostedService<ApplePrivateRelayBlocker>();\nbuilder.Services.AddHostedService<ApplePrivateRelayBlocker>();','builder.Services.AddHostedService<ApplePrivateRelayBlocker>();')
          s=one(s,'version = "2.0.0-alpha.15",\n    importer','version = "2.0.0-alpha.16",\n    commit = BuildCommit(),\n    importer','version')
          s=one(s,'? new AdultClassification(false, 100, RootDomain(item.Domain), "Marked not adult by user", "user-safe-override")','? new AdultClassification(false, 100, RootDomainForWorker(item.Domain), "Marked not adult by user", "user-safe-override")','worker call')
          s=one(s,'    private static string ReadString(JsonElement element, params string[] path)','''    private static string RootDomainForWorker(string domain)
    {
        var parts = (domain ?? "").Trim('.').ToLowerInvariant().Split('.', StringSplitOptions.RemoveEmptyEntries);
        return parts.Length >= 2 ? string.Join('.', parts[^2], parts[^1]) : domain ?? "";
    }

    private static string ReadString(JsonElement element, params string[] path)''','worker helper')
          s=one(s,"return parts.Length >= 2 ? string.Join('.', parts[^2], parts[^1]) : domain;","return parts.Length >= 2 ? string.Join('.', parts[^2], parts[^1]) : domain ?? \"\";",'nullability')
          marker='static async Task RepairDuplicateDevicesAsync(HomeWatchDb db)'
          helper='''static string BuildCommit()
{
    var configured = Environment.GetEnvironmentVariable("HOMEWATCH_COMMIT");
    if (!string.IsNullOrWhiteSpace(configured)) return configured.Trim();
    try
    {
        var start = new System.Diagnostics.ProcessStartInfo("git", "rev-parse --short HEAD") { RedirectStandardOutput=true, RedirectStandardError=true, UseShellExecute=false, CreateNoWindow=true };
        using var process = System.Diagnostics.Process.Start(start);
        if (process is null) return "unknown";
        var value = process.StandardOutput.ReadToEnd().Trim();
        process.WaitForExit(2000);
        return process.ExitCode == 0 && value.Length > 0 ? value : "unknown";
    }
    catch { return "unknown"; }
}

'''
          s=one(s,marker,helper+marker,'commit helper'); p.write_text(s,encoding='utf-8')
          p=Path('HomeWatch2/NetworkDiscovery.cs'); s=p.read_text(encoding='utf-8-sig'); s=one(s,'    IHttpClientFactory httpClientFactory,\n    IConfiguration configuration,','    IConfiguration configuration,','warning'); p.write_text(s,encoding='utf-8')
          p=Path('HomeWatch2/wwwroot/index.html'); s=p.read_text(encoding='utf-8-sig').replace('2.0.0-alpha.15','2.0.0-alpha.16')
          old='<section id="sessionsView" class="view"><section class="page-heading"><div><span class="eyebrow">LIVE ADULT SESSIONS</span><h2>Grouped session timeline</h2><p>Adult-related activity is grouped by device and updated live as additional domains are detected.</p></div><button id="refreshSessions">Refresh</button></section><section class="session-toolbar panel"><input id="sessionSearch" type="search" placeholder="Search device or website"><select id="sessionHours"><option value="1">Last hour</option><option value="24" selected>Today</option><option value="168">Last 7 days</option><option value="720">Last 30 days</option></select></section><section id="sessionList" class="session-list"><div class="panel empty">Loading live sessions…</div></section></section>'
          new='<section id="sessionsView" class="view"><section class="page-heading"><div><span class="eyebrow">NETWORK SESSIONS</span><h2>Grouped activity timeline</h2><p>Browse sessions across social media, streaming, messaging, shopping, adult content, infrastructure, and other network activity.</p></div><button id="refreshSessions">Refresh</button></section><section class="session-toolbar panel"><input id="sessionSearch" type="search" placeholder="Search device, service, or website"><select id="sessionCategory"><option value="all">All session types</option><option value="adult">Adult</option><option value="social">Social media</option><option value="streaming">Streaming and video</option><option value="messaging">Messaging</option><option value="shopping">Shopping</option><option value="gaming">Gaming</option><option value="productivity">Productivity</option><option value="development">Development</option><option value="advertising">Advertising and tracking</option><option value="privacy-proxy">VPN, proxy, or encrypted DNS</option><option value="system">Network and system</option><option value="other">Other or unknown</option></select><select id="sessionHours"><option value="1">Last hour</option><option value="24" selected>Today</option><option value="168">Last 7 days</option><option value="720">Last 30 days</option></select></section><section id="sessionList" class="session-list"><div class="panel empty">Loading sessions…</div></section></section>'
          s=one(s,old,new,'sessions markup'); s=re.sub(r'\s*<script src="/live-session-timeline\.js\?v=[^"]+"></script>','',s,count=1); p.write_text(s,encoding='utf-8')
          p=Path('HomeWatch2/wwwroot/app.js'); s=p.read_text(encoding='utf-8-sig').replace("const HOMEWATCH_VERSION = '2.0.0-alpha.10';","const HOMEWATCH_VERSION = '2.0.0-alpha.16';")
          s=one(s,"byId('version').textContent = `v${status.version || HOMEWATCH_VERSION}`;","byId('version').textContent = `v${status.version || HOMEWATCH_VERSION}${status.commit ? ` · ${String(status.commit).slice(0,7)}` : ''}`;",'badge')
          start=s.index('async function loadSessions() {'); end=s.index('function eventRow(event, showDevice) {')
          code=r'''async function loadSessions() {
  byId('refreshSessions').disabled = true;
  const hours=byId('sessionHours').value, search=byId('sessionSearch').value.trim().toLowerCase(), category=byId('sessionCategory')?.value||'all';
  byId('sessionList').innerHTML='<div class="panel empty">Loading sessions…</div>';
  try { const response=await fetch(`/api/dashboard?hours=${encodeURIComponent(hours)}`,{cache:'no-store'}); if(!response.ok)throw new Error('Could not load sessions.'); const data=await response.json(); const sessions=buildSessions(data.events||[]).filter(x=>(category==='all'||x.category===category)&&(!search||[x.deviceName,x.deviceIp,x.domain,x.service,x.category].some(v=>String(v||'').toLowerCase().includes(search)))); byId('sessionList').innerHTML=sessions.length?sessions.map(sessionCard).join(''):'<div class="panel empty">No sessions match this period, type, or search.</div>'; }
  catch(error){byId('sessionList').innerHTML=`<div class="panel empty error">${escapeHtml(error.message)}</div>`} finally{byId('refreshSessions').disabled=false}
}
function classifySessionCategory(e){const d=String(e.domain||'').toLowerCase(),c=String(e.category||'').toLowerCase();if(c==='adult')return'adult';if(/tiktok|facebook|fbcdn|instagram|twitter|x\.com|snapchat|reddit|pinterest|linkedin/.test(d))return'social';if(/youtube|googlevideo|netflix|nflx|spotify|twitch|vimeo|disneyplus|hulu|primevideo/.test(d))return'streaming';if(/whatsapp|telegram|signal|messenger|discord|skype|teams/.test(d))return'messaging';if(/amazon|ebay|walmart|etsy|shopify|bestbuy|costco|aliexpress/.test(d))return'shopping';if(/xbox|playstation|steam|epicgames|roblox|minecraft|nintendo/.test(d))return'gaming';if(/office|outlook|onedrive|dropbox|notion|slack|zoom|calendar/.test(d))return'productivity';if(/github|gitlab|stackoverflow|npmjs|nuget|docker|azure|aws|cloudflare/.test(d))return'development';if(c==='advertising'||/doubleclick|adservice|adbutler|scorecardresearch|analytics|pixel|telemetry/.test(d))return'advertising';if(['privacy-proxy','bypass','encrypted-dns'].includes(c)||/private-relay|cloudflare-dns|dns\.google|nextdns|quad9/.test(d))return'privacy-proxy';if(/apple|icloud|microsoft|windowsupdate|gstatic|googleapis|amazonaws|cloudfront|akamai|cdn/.test(d))return'system';return'other'}
function sessionService(domain,category){const d=String(domain||'').toLowerCase(),known=[[/tiktok/,'TikTok'],[/facebook|fbcdn|instagram/,'Meta'],[/youtube|googlevideo/,'YouTube'],[/netflix|nflx/,'Netflix'],[/spotify/,'Spotify'],[/whatsapp/,'WhatsApp'],[/telegram/,'Telegram'],[/amazon/,'Amazon'],[/github/,'GitHub'],[/microsoft|office|outlook|teams|live\.com/,'Microsoft'],[/google|gstatic|googleapis/,'Google'],[/apple|icloud/,'Apple'],[/discord/,'Discord']],match=known.find(([p])=>p.test(d));return match?match[1]:(category==='adult'?'Adult content':rootDomain(domain))}
function buildSessions(events){const sorted=[...events].sort((a,b)=>parseServerDate(a.timestamp)-parseServerDate(b.timestamp)),sessions=[],open=new Map();for(const e of sorted){const category=classifySessionCategory(e),service=sessionService(e.domain,category),key=`${e.deviceId||e.deviceName}|${category}|${service}`,timestamp=parseServerDate(e.timestamp);let x=open.get(key);if(!x||timestamp-parseServerDate(x.end)>600000){x={deviceName:e.deviceName||e.deviceIp||'Unknown device',deviceIp:e.deviceIp||'',domain:e.domain,service,category,start:e.timestamp,end:e.timestamp,requests:1,domains:new Set([e.domain])};sessions.push(x);open.set(key,x)}else{x.end=e.timestamp;x.requests++;x.domain=e.domain;x.domains.add(e.domain)}}return sessions.sort((a,b)=>parseServerDate(b.end)-parseServerDate(a.end))}
function sessionCard(x){const durationSeconds=Math.max(0,Math.round((parseServerDate(x.end)-parseServerDate(x.start))/1000)),domainCount=x.domains?x.domains.size:1;return `<article class="panel session-card"><div class="session-device"><span class="device-avatar">${escapeHtml(x.deviceName.slice(0,1).toUpperCase())}</span><div><strong>${escapeHtml(x.deviceName)}</strong><small>${escapeHtml(x.deviceIp)}</small></div></div><div class="session-domain"><strong>${escapeHtml(x.service)}</strong><span>${escapeHtml(x.domain)} · ${domainCount} domain${domainCount===1?'':'s'} · ${x.requests} request${x.requests===1?'':'s'}</span></div><div class="session-time"><span class="pill">${escapeHtml(x.category)}</span><strong>${escapeHtml(formatDuration(durationSeconds))}</strong><span>${escapeHtml(formatEventTime(x.start))} – ${escapeHtml(formatEventTime(x.end))}</span></div></article>`}

'''
          s=s[:start]+code+s[end:]; s=one(s,"byId('sessionHours').addEventListener('change', loadSessions);","byId('sessionHours').addEventListener('change', loadSessions);\nbyId('sessionCategory')?.addEventListener('change', loadSessions);",'listener'); p.write_text(s,encoding='utf-8')
          '@ | python -
          node --check .\HomeWatch2\wwwroot\app.js
          dotnet build .\HomeWatch2\HomeWatch2.csproj --configuration Release -warnaserror
          if (Select-String .\HomeWatch2\wwwroot\index.html 'LIVE ADULT SESSIONS') { throw 'Old wording remains' }
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add HomeWatch2/Program.cs HomeWatch2/NetworkDiscovery.cs HomeWatch2/wwwroot/index.html HomeWatch2/wwwroot/app.js
          git commit -m 'Fix build, generalize sessions, and show deployed commit'
          git push origin HEAD:homewatch-v2
