name: HomeWatch2 CI

on:
  workflow_dispatch:
  push:
    branches:
      - homewatch-v2
    paths:
      - 'HomeWatch2/**'
      - '.github/workflows/homewatch2-next-fix.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'HomeWatch2/**'
      - '.github/workflows/homewatch2-next-fix.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Restore
        run: dotnet restore .\HomeWatch2\HomeWatch2.csproj

      - name: Validate JavaScript
        run: node --check .\HomeWatch2\wwwroot\app.js

      - name: Build Release
        run: dotnet build .\HomeWatch2\HomeWatch2.csproj --configuration Release --no-restore
