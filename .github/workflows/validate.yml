name: Validate HomeWatch

on:
  push:
    branches:
      - stabilization
  pull_request:
    branches:
      - main
      - stabilization

jobs:
  validate:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate HomeWatch source
        shell: powershell
        run: .\scripts\Test-HomeWatch.ps1
