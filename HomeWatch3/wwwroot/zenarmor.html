<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HomeWatch 4 · Zenarmor</title><link rel="stylesheet" href="/styles.css"></head>
<body><header class="topbar"><h1>Zenarmor</h1><nav class="topnav"><a class="nav-link" href="/">Dashboard</a><a class="nav-link" href="/live.html">Live Activity</a><a class="nav-link" href="/devices.html">Devices</a><a class="nav-link" href="/notifications.html">Settings</a></nav></header>
<main class="wrap"><section class="card section"><h2>Collector health</h2><div id="sources"></div><p id="health" role="status">Loading…</p><button class="button" id="sync">Sync now</button> <button class="button secondary-button" id="toggle" disabled>Collector settings</button></section>
<section class="card section"><h2>Retained observations</h2><div id="overview"></div></section>
<section class="card section"><h2>Source evidence</h2><form id="filters"><label>Source <select name="source" class="text-input"><option value="dns">DNS</option><option value="connections">Connections</option><option value="http">HTTP</option><option value="tls">TLS</option><option value="alerts">Alerts</option><option value="security-tags">Security tags</option><option value="sip">SIP</option></select></label> <label>Domain <input class="text-input" name="domain"></label> <label>Zenarmor device ID <input class="text-input" name="device"></label> <label>Domain category <input class="text-input" name="category"></label> <label>Policy <select class="text-input" name="blocked"><option value="">Any</option><option value="true">Blocked</option><option value="false">Allowed</option></select></label> <button class="button">Search</button></form><div id="events"></div><button class="button" id="more" hidden>Older observations</button></section>
<section class="card section"><h2>Daily domain categories</h2><p>UTC reporting days. Select a category to inspect its DNS evidence.</p><div id="categories"></div></section></main>
<script src="/auth-client.js"></script><script src="/zenarmor.js"></script></body></html>
